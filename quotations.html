<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotations — OM SAI Interiors & Construction</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="quotations">

<header id="site-header" class="site-header"></header>

<section class="page-hero">
  <div class="container">
    <span class="breadcrumb"><a href="index.html">Home</a> / Quotations</span>
    <span class="eyebrow" style="margin-top:14px;display:inline-flex">Get a price</span>
    <h1>Request a Quotation</h1>
    <p>Share your requirements — our estimator sends back an itemised quote, no obligation to proceed.</p>
  </div>
</section>

<section class="section">
  <div class="container grid grid-2" style="align-items:flex-start;gap:48px">
    <div class="form-card">
      <div class="form-msg" id="quotation-msg"></div>
      <form id="quotation-form">
        <div class="form-row">
          <div class="form-group"><label for="qt-category">Service category</label><select class="form-control" id="qt-category" required></select></div>
          <div class="form-group"><label for="qt-subservice">Sub-service</label><select class="form-control" id="qt-subservice" required disabled></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="qt-area">Approx. area (sq.ft.)</label><input class="form-control" id="qt-area" type="number" min="1" placeholder="e.g. 1200"></div>
          <div class="form-group"><label for="qt-budget">Budget range (optional)</label><input class="form-control" id="qt-budget" placeholder="e.g. ₹2,00,000 – ₹3,00,000"></div>
        </div>
        <div class="form-group"><label for="qt-requirements">Requirements</label><textarea class="form-control" id="qt-requirements" required placeholder="Describe the scope — rooms, current condition, finishes you have in mind"></textarea></div>
        <button class="btn btn-primary btn-block" type="submit">Request quotation</button>
      </form>
    </div>
    <div>
      <h3>Your quotation requests</h3>
      <div class="tick-rule" style="margin-bottom:20px"></div>
      <div id="quotation-list"></div>
      <div class="empty-state" id="quotation-empty" style="display:none">No quotation requests yet.</div>
    </div>
  </div>
</section>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/services-data.js"></script>
<script src="js/layout.js"></script>
<script src="js/quotations.js"></script>
</body>
</html>
